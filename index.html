<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Veterinaria Castán | Cirugía y rehabilitación veterinaria en Miramar</title>
    <meta
      name="description"
      content="Veterinaria Castán en Miramar, Buenos Aires: cirugía general, traumatológica y ortopédica, ecografía, cardiología y rehabilitación veterinaria. Consultas por WhatsApp."
    />
    <meta name="theme-color" content="#1F2A44" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="Veterinaria Castán" />
    <meta property="og:title" content="Veterinaria Castán | Cirugía y rehabilitación veterinaria" />
    <meta
      property="og:description"
      content="Cirugía, diagnóstico por imágenes, cardiología y rehabilitación veterinaria en Miramar."
    />
    <meta property="og:image" content="/img/real/cirugia-equipo.webp" />
    <meta name="twitter:card" content="summary_large_image" />

    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/brand/logo-ilustracion-360.webp"
      imagesrcset="/brand/logo-ilustracion-360.webp 360w, /brand/logo-ilustracion-720.webp 720w"
      imagesizes="20rem"
      fetchpriority="high"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/img/real/hero-rehabilitacion.webp"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VeterinaryCare",
        "name": "Veterinaria Castán",
        "description": "Cirugía, diagnóstico por imágenes, cardiología y rehabilitación veterinaria en Miramar, Buenos Aires.",
        "telephone": "+54 9 2291 41-1543",
        "openingHours": "Mo-Sa 09:30-12:30",
        "aggregateRating": { "@type": "AggregateRating", "ratingValue": "4.7", "reviewCount": "128" },
        "areaServed": "Miramar, Buenos Aires",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Calle 38 1125",
          "addressLocality": "Miramar",
          "postalCode": "B7607",
          "addressRegion": "Buenos Aires",
          "addressCountry": "AR"
        }
      }
    </script>
    <script>
      // Animación de entrada: solo la primera vez por sesión y nunca con "reducir movimiento".
      // Se decide antes del primer render para que el hero espere a la cortina.
      ;(function () {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return
        try {
          if (sessionStorage.getItem('castan-intro')) return
          sessionStorage.setItem('castan-intro', '1')
        } catch (e) {}
        document.documentElement.classList.add('has-intro', 'intro-running')
      })()
    </script>
    <style>
      /* Mientras carga el JS, la pantalla ya muestra el fondo de la entrada (sin destello claro) */
      .has-intro #root:empty {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #161e33, #1f2a44 55%, #2f4575);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
